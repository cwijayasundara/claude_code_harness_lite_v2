name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22.18', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci || npm install
      - run: npm run typecheck
      - run: node --disable-warning=ExperimentalWarning --test scripts/*.spec.ts
  dogfood:
    if: false # off for now: the harness is not run on its own repo; to re-enable: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18'
      - run: npm ci || npm install
      - run: node --disable-warning=ExperimentalWarning scripts/sdlc.ts check --at ci --base "origin/${{ github.base_ref || 'main' }}"
