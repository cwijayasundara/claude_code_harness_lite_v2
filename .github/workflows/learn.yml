name: learn
# rig learn without the mod: zero tokens, read-only. It prints proposals to the job summary; a person promotes with /rig-approve.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
jobs:
  learn:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18'
      - run: |
          { echo '```'; node --disable-warning=ExperimentalWarning scripts/sdlc.ts learn; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
